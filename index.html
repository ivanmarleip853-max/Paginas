<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucas Phone — Catálogo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--wall:#20242c;--ink:#101216;--page:#f4f3f0;--card:#fff;--line:#e2dfd8;--mute:#6b6f78;--gold:#d9a937;--gold-t:#e8c35e;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,sans-serif}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* topo: letras pretas, luz dourada atrás */
.top{position:sticky;top:0;z-index:8;background:var(--wall);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;flex-direction:column;padding-top:10px;padding-bottom:10px}
.sign{margin:0;font:900 30px/.9 Archivo,sans-serif;color:#000;filter:drop-shadow(0 0 7px rgba(217,169,55,.65)) drop-shadow(0 4px 8px rgba(217,169,55,.4))}
.lbl{color:#b9bdc6;font-size:12px;letter-spacing:.22em;margin-top:6px}
/* painel de oportunidades */
.op{background:var(--wall);color:#fff;border-radius:16px;margin:16px 0 0;padding:20px 16px 16px}
.oph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.op h2{font:800 clamp(28px,8vw,40px)/1 Archivo,sans-serif;margin:0}
.op h2 i{color:var(--gold);font-style:normal}
.all{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 16px;font:700 14px Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.slide{display:grid;grid-template-columns:42% 1fr;gap:16px;margin-top:22px;align-items:center;animation:in .35s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}}
.sp{aspect-ratio:3/4;background:#fff;border-radius:12px;display:grid;place-items:center;color:#8d9099;font-size:12px;overflow:hidden}
.sp img{width:100%;height:100%;object-fit:contain}
.st{color:var(--gold-t);font-weight:700;font-size:14px}
.sn{font:800 clamp(20px,6vw,30px)/1.05 Archivo,sans-serif;text-transform:uppercase;margin:4px 0 6px}
.ss{color:#c4c8d0;font-size:14px;margin:0}
.sprice{font:800 clamp(26px,7.5vw,38px)/1 Archivo,sans-serif;margin:14px 0}
.sbtn{display:inline-block;background:#fff;color:var(--ink);text-decoration:none;font:700 14px Manrope,sans-serif;padding:13px 18px;border-radius:999px}
.sbtn:hover{background:var(--gold-t)}
.note{color:#9ea3ad;font-size:13px;margin:12px 0 0}
.nav{display:flex;align-items:center;gap:12px;margin-top:18px}
.cnt{font:700 15px Manrope,sans-serif}.cnt span{color:#9ea3ad;font-weight:500}
.prog{flex:1;max-width:120px;height:3px;background:#3a3f4a;border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.arr{display:flex;gap:8px;margin-left:auto}
.arr button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:18px;cursor:pointer}
/* busca e filtros */
.search{margin-top:20px}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px 16px;font:500 16px Manrope,sans-serif}
.seg{display:flex;background:#e9e8e4;border-radius:12px;padding:5px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:12px 4px;font:700 15px Manrope,sans-serif;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),inset 0 -2px 0 var(--gold)}
.subs{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.subs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 18px;font:700 14px Manrope,sans-serif;cursor:pointer}
.subs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.jump{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;font:700 15px Manrope,sans-serif;color:var(--ink);cursor:pointer}
.jump span{color:var(--gold)}
/* lista */
.eyebrow{display:block;color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:30px}
h3.big{font:800 clamp(26px,7vw,36px)/1.05 Archivo,sans-serif;margin:8px 0 14px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);gap:8px;flex-wrap:wrap}
.clear{border:0;background:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px;font:700 14px Manrope,sans-serif;cursor:pointer;padding:6px 0}
.ord{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin:12px 0}
select{border:0;border-bottom:1px solid var(--ink);background:none;color:var(--ink);padding:6px 2px;font:500 15px Manrope,sans-serif}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:90px}
.brand{display:flex;flex-direction:column}
.tg{display:none;color:#b9bdc6;font-size:14px}
.ctl{display:flex;flex-direction:column}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.slide{grid-template-columns:260px 1fr}}
@media(min-width:900px){
.top .wrap{flex-direction:row;align-items:center;justify-content:space-between}
.tg{display:block}
.op{padding:34px 40px 28px;border-radius:24px;margin-top:24px}
.slide{grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
.sp{aspect-ratio:auto;height:300px;border-radius:20px}
.sn{font-size:46px}.sprice{font-size:42px}
.ctl{flex-direction:row;align-items:center;gap:12px;margin-top:28px}
.ctl .seg{order:-1;margin:0;flex:none}
.ctl .search{flex:1;margin:0}
.seg button{padding:12px 20px}
.lh{display:flex;justify-content:space-between;align-items:flex-end}
.grid{gap:16px}
}
.card{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1/1;background:#ebe9e4;display:grid;place-items:center;color:#8d9099;font-size:12px}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.tag{position:absolute;top:8px;right:8px;background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.info{padding:12px;display:flex;flex-direction:column;flex:1}
.card h4{margin:0;font:800 15px/1.2 Archivo,sans-serif;text-transform:uppercase}
.cat{color:var(--mute);font-size:13px;margin:4px 0 0}
.spec{color:var(--mute);font-size:13px;margin:2px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:12px}
.price{font:800 20px Archivo,sans-serif}
.go{display:grid;place-items:center;flex:none;width:36px;height:36px;background:#fff;color:var(--ink);border:1px solid var(--line);text-decoration:none;font:700 15px Manrope,sans-serif;border-radius:50%}
.go:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{grid-column:1/-1;color:var(--mute);padding:24px 0}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:#fff;text-decoration:none;font:700 14px Manrope,sans-serif;padding:13px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
footer{background:var(--wall);color:#aeb2bb;font-size:13px;padding:20px 0 90px}
[hidden]{display:none!important}
.top .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.hb{display:flex;gap:8px}
.hb button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:10px 13px;font:700 13px Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.hm{display:none}
@media(min-width:560px){.hm{display:inline}}
.dgrid{display:grid;gap:20px;padding-top:20px;padding-bottom:130px}
@media(min-width:900px){.dgrid{grid-template-columns:1fr 1fr;gap:56px;padding-top:36px}}
.dph{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;align-self:start}
.dtags{display:flex;gap:6px}
.dtags span{background:#ebe9e4;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.dtags .dk{background:var(--ink);color:#fff}
.dimg{aspect-ratio:1/1;display:grid;place-items:center;color:#8d9099;font-size:13px}
.dimg img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;justify-content:center;margin-top:10px}
.thumbs button{width:56px;height:56px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px;cursor:pointer}
.thumbs img{width:100%;height:100%;object-fit:contain}
.deye{color:var(--gold);font-weight:700;font-size:14px}
.dinfo h2{font:800 clamp(28px,8vw,48px)/1.02 Archivo,sans-serif;text-transform:uppercase;margin:6px 0 10px}
.dcat{color:var(--mute);margin:0}
.dkind{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mute);margin:4px 0 20px}
.plbl{color:var(--mute)}
.dprice{font:800 36px Archivo,sans-serif;margin:2px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.ic small{display:block;color:var(--mute);font-size:12px}
.ic b{font-size:15px}
.dinfo h3{font:800 18px Archivo,sans-serif;margin:24px 0 8px}
.ddesc{color:var(--mute);margin:0}
.bar2{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#fff;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar2 .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar2 span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2 b{font:800 20px Archivo,sans-serif}
.cta{background:#1c7c3f;color:#fff;text-decoration:none;font:700 15px Manrope,sans-serif;padding:15px 22px;border-radius:999px;white-space:nowrap}
.cta i{font-style:normal;margin-left:10px;padding-left:10px;border-left:1px solid rgba(255,255,255,.45)}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1 class="sign" aria-label="Lucas Phone">LUCAS PHONE</h1><span class="lbl">CATÁLOGO</span></div>
  <span class="tg">Aparelhos e acessórios para o seu dia a dia.</span>
  <div class="hb" id="hb" hidden><button id="hback">← Catálogo</button><button id="hshare" aria-label="Compartilhar"></button></div>
</div></header>

<main class="wrap">
  <section class="op" id="op" aria-label="Oportunidades">
    <div class="oph"><h2>Oportunidades<i>.</i></h2><button class="all" id="all">Ver todas →</button></div>
    <div id="slide"></div>
    <div class="nav">
      <div class="cnt" id="cnt"></div><div class="prog"><b id="pb"></b></div>
      <div class="arr"><button id="pv" aria-label="Anterior">‹</button><button id="nx" aria-label="Próximo">›</button></div>
    </div>
  </section>

  <div class="ctl" id="catalogo">
  <div class="search"><input id="q" type="search" placeholder="Buscar aparelho, acessório, modelo…" aria-label="Buscar produtos" autocomplete="off"></div>
  <div class="seg" id="seg">
    <button data-g="todos" aria-pressed="true">Todos</button>
    <button data-g="aparelhos" aria-pressed="false">Aparelhos</button>
    <button data-g="acessorios" aria-pressed="false">Acessórios</button>
  </div>
  </div>
  <div class="subs" id="subs" hidden></div>
  <button class="jump" id="jump">Oportunidades <span>↑</span></button>

  <span class="eyebrow">Selecionados para você</span>
  <div class="lh"><div>
  <h3 class="big">Escolha o seu e fale com o Lucas.</h3>
  <div class="meta"><span id="gc"></span><button class="clear" id="clr" hidden>Limpar filtros ×</button></div></div>
  <label class="ord">Ordenar por
    <select id="sort"><option value="ordem">Ordem do catálogo</option><option value="nome">Nome A–Z</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select>
  </label></div>
  <div class="grid" id="grid"></div>
</main>
<footer><div class="wrap"><strong style="color:#fff;font:800 16px Archivo,sans-serif">Lucas Phone</strong><br>Aparelhos e acessórios. Consulte condições, cores e disponibilidade pelo WhatsApp.</div></footer>
<div id="detail" hidden></div>
<a class="fab" id="fab" target="_blank" rel="noopener">WhatsApp</a>

<script src="config.js"></script>
<script>
var WHATS=CONFIG.WHATS;
var PRODUTOS=[];
var $=function(i){return document.getElementById(i)};
var g="todos",sub="todos",term="",onlyOp=false,idx=0,timer;
function brl(v){return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:v%1?2:0})}
function zap(m){return "https://wa.me/"+WHATS+"?text="+encodeURIComponent(m)}
var CAT={"Novo":"aparelhos novos","Seminovo":"aparelhos seminovos","Acessório":"acessórios"};
function msg(p){return "Olá, quero saber mais sobre "+(CAT[p.tipo]||p.tipo)+".\n\nProduto: "+p.nome+"\nCategoria: "+p.tipo+(p.marca?"\nMarca: "+p.marca:"")+"\nPreço: "+brl(p.preco)+"\n\nPode confirmar se ainda está disponível?"}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function isAcc(p){return p.tipo==="Acessório"}
function photo(p){return p.foto?'<img src="'+p.foto+'" alt="'+p.nome+'" loading="lazy">':'Foto em breve'}
function card(p){
  return '<article class="card" data-i="'+p.id+'"><div class="ph">'+photo(p)+'<span class="tag">'+p.tipo+'</span></div><div class="info"><h4>'+p.nome+'</h4><p class="cat">'+p.cat+(p.marca?' · '+p.marca.toUpperCase():'')+'</p><p class="spec">'+p.spec+'</p><div class="row"><span class="price">'+brl(p.preco)+'</span><a class="go" aria-label="Ver '+p.nome+'" href="#p-'+p.id+'">↗</a></div></div></article>';
}
/* carrossel de oportunidades */
var SL=[];
function show(i){
  if(!SL.length){$("op").hidden=true;return}
  idx=(i+SL.length)%SL.length; var p=SL[idx];
  $("slide").innerHTML='<div class="slide"><div class="sp">'+photo(p)+'</div><div><div class="st">'+p.tipo+'</div><div class="sn">'+p.nome+'</div><p class="ss">'+p.spec+'</p><div class="sprice">'+brl(p.preco)+'</div><a class="sbtn" href="#p-'+p.id+'">Ver oportunidade →</a><p class="note">Consulte condições e disponibilidade.</p></div></div>';
  $("cnt").innerHTML=("0"+(idx+1)).slice(-2)+' <span>'+("0"+SL.length).slice(-2)+'</span>';
  $("pb").style.width=((idx+1)/SL.length*100)+"%";
}
function auto(){clearInterval(timer);if(SL.length<2||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;timer=setInterval(function(){show(idx+1)},4500)}
$("nx").onclick=function(){show(idx+1);auto()};
$("pv").onclick=function(){show(idx-1);auto()};
$("slide").addEventListener("touchstart",function(){clearInterval(timer)});
$("slide").addEventListener("touchend",auto);
/* filtros */
function subsFor(){
  if(g==="aparelhos")return [["todos","Todos aparelhos"],["Novo","Novos"],["Seminovo","Seminovos"]];
  var c=[];PRODUTOS.filter(isAcc).forEach(function(p){if(c.indexOf(p.cat)<0)c.push(p.cat)});
  return [["todos","Todos acessórios"]].concat(c.map(function(x){return [x,x]}));
}
function render(){
  var l=PRODUTOS.filter(function(p){
    if(g==="aparelhos"&&isAcc(p))return false;
    if(g==="acessorios"&&!isAcc(p))return false;
    if(sub!=="todos"&&(g==="aparelhos"?p.tipo:p.cat)!==sub)return false;
    if(onlyOp&&!(p.oportunidade||p.destaque))return false;
    return !term||norm(p.nome+" "+p.spec+" "+p.tipo+" "+p.cat+" "+(p.marca||"")).indexOf(term)>-1;
  });
  var s=$("sort").value;
  if(s==="nome")l.sort(function(a,b){return a.nome.localeCompare(b.nome,"pt-BR")});
  if(s==="menor")l.sort(function(a,b){return a.preco-b.preco});
  if(s==="maior")l.sort(function(a,b){return b.preco-a.preco});
  document.querySelectorAll("#seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.g===g)});
  var sb=$("subs");sb.hidden=g==="todos";
  if(g!=="todos")sb.innerHTML=subsFor().map(function(x){return '<button data-s="'+x[0]+'" aria-pressed="'+(x[0]===sub)+'">'+x[1]+'</button>'}).join("");
  $("gc").textContent=l.length+(l.length===1?" produto encontrado":" produtos encontrados");
  $("clr").hidden=!(g!=="todos"||term||onlyOp);
  $("grid").innerHTML=l.length?l.map(card).join(""):'<p class="empty">Nada encontrado. Tente outro nome ou chame o Lucas no WhatsApp.</p>';
}
$("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;g=b.dataset.g;sub="todos";render()});
$("subs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;sub=b.dataset.s;render()});
$("q").addEventListener("input",function(){term=norm(this.value.trim());render()});
$("sort").addEventListener("change",render);
$("clr").onclick=function(){g="todos";sub="todos";term="";onlyOp=false;$("q").value="";render()};
$("all").onclick=function(){g="todos";sub="todos";term="";$("q").value="";onlyOp=true;render();$("catalogo").scrollIntoView({behavior:"smooth"})};
$("jump").onclick=function(){$("op").scrollIntoView({behavior:"smooth"})};
$("fab").href=zap("Olá, Lucas! Vim pelo catálogo e quero atendimento.");
/* tela do produto (mesma página, sem nova aba) */
var lastY=0,fromApp=false,curF=[],SH="⤴<span class='hm'> Compartilhar</span>";
$("hshare").innerHTML=SH;
function mark(){lastY=window.scrollY;fromApp=true}
$("grid").addEventListener("click",function(e){var c=e.target.closest(".card");if(!c)return;e.preventDefault();mark();location.hash="p-"+c.dataset.i});
$("slide").addEventListener("click",function(e){if(e.target.closest(".sbtn"))mark()});
function ic(k,v){return `<div class="ic"><small>${k}</small><b>${v}</b></div>`}
function showDetail(p){
  var acc=isAcc(p);curF=p.fotos||(p.foto?[p.foto]:[]);
  var thumbs=curF.length>1?'<div class="thumbs">'+curF.map(function(f,k){return `<button data-k="${k}" aria-label="Foto ${k+1}"><img src="${f}" alt=""></button>`}).join("")+'</div>':"";
  $("detail").innerHTML=`<div class="wrap dgrid"><div class="dph"><div class="dtags"><span>${p.tipo}</span><span class="dk">Consulte disponibilidade</span></div><div class="dimg" id="dimg">${curF[0]?`<img src="${curF[0]}" alt="${p.nome}">`:"Foto em breve"}</div>${thumbs}</div><div class="dinfo"><span class="deye">${acc?"Acessórios":"Aparelhos"}</span><h2>${p.nome}</h2><p class="dcat">${p.cat}${p.marca?" · "+p.marca.toUpperCase():""}</p><p class="dkind">${acc?"Acessório":"Aparelho "+p.tipo}</p><small class="plbl">Preço no catálogo</small><div class="dprice">${brl(p.preco)}</div><div class="ig">${ic("Categoria",p.cat)}${p.marca?ic("Marca",p.marca):""}${acc?"":ic("Condição",p.tipo)}${ic("Disponibilidade","Consulte a loja")}</div><h3>Sobre este produto</h3><p class="ddesc">${p.desc||p.spec}</p></div></div><div class="bar2"><div class="wrap"><div><span>${p.nome}</span><b>${brl(p.preco)}</b></div><a class="cta" target="_blank" rel="noopener" href="${zap(msg(p))}">Eu quero esse <i>${brl(p.preco)}</i></a></div></div>`;
}
$("detail").addEventListener("click",function(e){var b=e.target.closest(".thumbs button");if(b)$("dimg").innerHTML='<img src="'+curF[b.dataset.k]+'" alt="">'});
function view(d){document.querySelector("main").hidden=d;document.querySelector("footer").hidden=d;$("fab").hidden=d;$("detail").hidden=!d;$("hb").hidden=!d}
function route(){
  var m=location.hash.match(/^#p-(\d+)$/),p=m&&PRODUTOS.filter(function(x){return x.id==m[1]})[0];
  if(p){showDetail(p);view(true);window.scrollTo(0,0);document.title=p.nome+" — Lucas Phone"}
  else{view(false);document.title="Lucas Phone — Catálogo";window.scrollTo(0,lastY)}
}
window.addEventListener("hashchange",route);
$("hback").onclick=function(){if(fromApp){fromApp=false;history.back()}else{location.hash=""}};
$("hshare").onclick=function(){
  var u=location.href,t=document.title,b=$("hshare");
  try{
    if(navigator.share){navigator.share({title:t,url:u}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){b.textContent="Link copiado";setTimeout(function(){b.innerHTML=SH},1800)}).catch(function(){})}
  }catch(err){}
};
function load(){
  var U=CONFIG.SUPABASE_URL,K=CONFIG.SUPABASE_KEY;
  $("grid").innerHTML='<p class="empty">Carregando produtos…</p>';
  fetch(U+"/rest/v1/produtos?select=*&ativo=eq.true&order=ordem.asc,id.desc",{headers:{apikey:K}})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(rows){
      PRODUTOS=rows.map(function(r){var f=r.fotos||[];return {id:r.id,nome:r.nome,tipo:r.tipo,cat:r.cat,marca:r.marca,spec:r.spec,desc:r.descricao,preco:Number(r.preco),foto:f[0]||"",fotos:f,destaque:r.destaque,oportunidade:r.oportunidade}});
      SL=PRODUTOS.filter(function(p){return p.oportunidade||p.destaque});
      $("op").hidden=!SL.length;
      show(0);auto();render();route();
    })
    .catch(function(){$("grid").innerHTML='<p class="empty">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</p>'});
}
load();
</script>
