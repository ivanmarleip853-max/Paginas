<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel — Lucas Phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--wall:#20242c;--ink:#101216;--page:#f4f3f0;--line:#e2dfd8;--mute:#6b6f78;--gold:#d9a937}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,sans-serif}
header{background:var(--wall);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.sign{margin:0;font:900 26px/.9 Archivo,sans-serif;color:#000;filter:drop-shadow(0 0 7px rgba(217,169,55,.65)) drop-shadow(0 4px 8px rgba(217,169,55,.4))}
.lbl{display:block;color:#b9bdc6;font-size:11px;letter-spacing:.2em;margin-top:5px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.pri{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700}
.sec{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:700;font-size:13px}
.danger{color:#a32020}
h2{font:800 22px Archivo,sans-serif;margin:8px 0 14px}
.f label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
.f input[type=text],.f input[type=email],.f input[type=password],.f input[type=search],.f select,.f textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.f textarea{min-height:90px}
.chk{display:flex;align-items:center;gap:10px;font-weight:500!important;margin:10px 0!important}
.chk input{width:20px;height:20px}
.msg{margin:12px 0;font-size:14px;color:#a32020}
.top{display:flex;gap:10px;margin-bottom:14px}
.top input{flex:1}
.it{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.it img,.it .ph{width:64px;height:64px;object-fit:contain;background:#ebe9e4;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10px;color:#8d9099}
.mi{flex:1;min-width:140px}.mi small{display:block;color:var(--mute)}
.mi em{font-style:normal;font-size:12px;color:var(--mute)}
.ac{display:flex;gap:6px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:var(--page);overflow:auto;z-index:20;padding-bottom:40px}
.ths{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.th{width:96px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:12px}
.th img{width:100%;height:80px;object-fit:contain}
.th button{margin-top:4px;width:100%;padding:6px 2px;font-size:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
.empty{color:var(--mute);padding:24px 0;text-align:center}
</style>
</head>
<body>
<header>
  <div><h1 class="sign">LUCAS PHONE</h1><span class="lbl">PAINEL DO DONO</span></div>
  <button class="sec" id="sair" hidden>Sair</button>
</header>
<main class="wrap">
  <section id="login" class="f" hidden>
    <h2>Entrar</h2>
    <form id="lf">
      <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required>
      <p class="msg" id="lm"></p>
      <button class="pri" type="submit">Entrar</button>
    </form>
  </section>

  <section id="app" hidden>
    <h2>Produtos</h2>
    <div class="top f"><input id="busca" type="search" placeholder="Buscar produto…" aria-label="Buscar"><button class="pri" id="novo">+ Novo</button></div>
    <div id="lista"></div>
  </section>
</main>

<div id="modal" hidden><div class="wrap f">
  <h2 id="mt">Novo produto</h2>
  <form id="pf">
    <label for="n">Nome do produto</label><input id="n" type="text" placeholder="Ex.: iPhone 14 128 GB" required>
    <div class="row">
      <div><label for="t">Tipo</label><select id="t"><option>Novo</option><option>Seminovo</option><option>Acessório</option></select></div>
      <div><label for="p">Preço (R$)</label><input id="p" type="text" inputmode="decimal" placeholder="3299 ou 3299,90" required></div>
    </div>
    <div class="row">
      <div><label for="c">Categoria</label><input id="c" type="text" list="cats" placeholder="iPhone, Fones, Capas…" required><datalist id="cats"></datalist></div>
      <div><label for="m">Marca</label><input id="m" type="text" placeholder="Apple"></div>
    </div>
    <label for="s">Especificação curta</label><input id="s" type="text" placeholder="Bateria acima de 90%">
    <label for="d">Descrição (aparece em “Sobre este produto”)</label><textarea id="d"></textarea>
    <label>Fotos (a primeira é a capa)</label>
    <input id="fi" type="file" accept="image/*" multiple>
    <div class="ths" id="ths"></div>
    <label class="chk"><input id="op" type="checkbox"> Mostrar nas Oportunidades (carrossel do topo)</label>
    <label class="chk"><input id="de" type="checkbox"> Mostrar em destaque (carrossel do topo)</label>
    <label class="chk"><input id="at" type="checkbox" checked> Visível no catálogo</label>
    <p class="msg" id="pm"></p>
    <div class="row"><button class="sec" type="button" id="cancel">Cancelar</button><button class="pri" type="submit" id="save">Salvar</button></div>
  </form>
</div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script>
var $=function(i){return document.getElementById(i)};
var sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
var rows=[],editing=null,items=[],removed=[];
function brl(v){return "R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:v%1?2:0})}
function pathOf(u){return decodeURIComponent(u.split("/produtos/").pop())}

/* login */
function enter(){$("login").hidden=true;$("app").hidden=false;$("sair").hidden=false;load()}
function leave(){$("login").hidden=false;$("app").hidden=true;$("sair").hidden=true}
sb.auth.getSession().then(function(r){r.data.session?enter():leave()});
$("lf").onsubmit=async function(e){
  e.preventDefault();$("lm").textContent="";
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error)$("lm").textContent="E-mail ou senha incorretos.";else enter();
};
$("sair").onclick=async function(){await sb.auth.signOut();leave()};

/* lista */
async function load(){
  var r=await sb.from("produtos").select("*").order("id",{ascending:false});
  if(r.error){$("lista").innerHTML='<p class="empty">Erro ao carregar: '+r.error.message+'</p>';return}
  rows=r.data||[];draw();
}
function draw(){
  var q=$("busca").value.trim().toLowerCase();
  var l=rows.filter(function(p){return !q||(p.nome+" "+p.cat+" "+p.marca).toLowerCase().indexOf(q)>-1});
  $("cats").innerHTML=Array.from(new Set(rows.map(function(p){return p.cat}))).map(function(c){return '<option value="'+c+'">'}).join("");
  if(!l.length){$("lista").innerHTML='<p class="empty">'+(rows.length?'Nenhum produto encontrado.':'Nenhum produto ainda. Toque em “+ Novo”.')+'</p>';return}
  $("lista").innerHTML=l.map(function(p){
    var b=[p.ativo?"":"Oculto",p.oportunidade?"Oportunidade":"",p.destaque?"Destaque":""].filter(Boolean).join(" · ");
    return '<div class="it">'+(p.fotos&&p.fotos[0]?'<img src="'+p.fotos[0]+'" alt="">':'<div class="ph">sem foto</div>')+
      '<div class="mi"><b>'+p.nome+'</b><small>'+p.tipo+' · '+p.cat+'</small><span>'+brl(p.preco)+'</span> <em>'+b+'</em></div>'+
      '<div class="ac"><button class="sec" data-a="e" data-id="'+p.id+'">Editar</button><button class="sec" data-a="v" data-id="'+p.id+'">'+(p.ativo?'Ocultar':'Mostrar')+'</button><button class="sec danger" data-a="x" data-id="'+p.id+'">Excluir</button></div></div>';
  }).join("");
}
$("busca").oninput=draw;
$("lista").onclick=async function(e){
  var b=e.target.closest("button");if(!b)return;
  var p=rows.filter(function(x){return x.id==b.dataset.id})[0];if(!p)return;
  if(b.dataset.a==="e")openForm(p);
  if(b.dataset.a==="v"){await sb.from("produtos").update({ativo:!p.ativo}).eq("id",p.id);load()}
  if(b.dataset.a==="x"&&confirm("Excluir “"+p.nome+"” de vez? Para só tirar do catálogo, use Ocultar.")){
    var r=await sb.from("produtos").delete().eq("id",p.id);
    if(r.error){alert("Erro ao excluir: "+r.error.message);return}
    if(p.fotos&&p.fotos.length)sb.storage.from("produtos").remove(p.fotos.map(pathOf));
    load();
  }
};

/* formulário */
function openForm(p){
  editing=p?p.id:null;removed=[];$("pm").textContent="";
  $("mt").textContent=p?"Editar produto":"Novo produto";
  $("n").value=p?p.nome:"";$("t").value=p?p.tipo:"Novo";$("p").value=p?String(p.preco).replace(".",","):"";
  $("c").value=p?p.cat:"";$("m").value=p?p.marca:"";$("s").value=p?p.spec:"";$("d").value=p?p.descricao:"";
  $("op").checked=p?p.oportunidade:false;$("de").checked=p?p.destaque:false;$("at").checked=p?p.ativo:true;
  items=(p&&p.fotos||[]).map(function(u){return {url:u,file:null}});
  drawThumbs();$("modal").hidden=false;window.scrollTo(0,0);
}
function drawThumbs(){
  $("ths").innerHTML=items.map(function(it,i){
    return '<div class="th"><img src="'+it.url+'" alt="">'+(i?'<button class="sec" type="button" data-a="m" data-i="'+i+'">Tornar capa</button>':'<b>Capa</b>')+'<button class="sec danger" type="button" data-a="r" data-i="'+i+'">Remover</button></div>';
  }).join("");
}
$("ths").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;var i=+b.dataset.i;
  if(b.dataset.a==="m")items.unshift(items.splice(i,1)[0]);
  if(b.dataset.a==="r"){var it=items.splice(i,1)[0];if(!it.file)removed.push(it.url)}
  drawThumbs();
};
$("fi").onchange=function(){
  Array.from(this.files).forEach(function(f){items.push({url:URL.createObjectURL(f),file:f})});
  this.value="";drawThumbs();
};
$("novo").onclick=function(){openForm(null)};
$("cancel").onclick=function(){$("modal").hidden=true};

async function shrink(file){
  var img=await createImageBitmap(file),k=Math.min(1,1200/Math.max(img.width,img.height));
  var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return new Promise(function(r){c.toBlob(r,"image/jpeg",.85)});
}
async function upload(file){
  var name=crypto.randomUUID()+".jpg",blob=await shrink(file);
  var r=await sb.storage.from("produtos").upload(name,blob,{contentType:"image/jpeg"});
  if(r.error)throw r.error;
  return sb.storage.from("produtos").getPublicUrl(name).data.publicUrl;
}
$("pf").onsubmit=async function(e){
  e.preventDefault();$("pm").textContent="";
  var preco=Number(String($("p").value).replace(/[R$\s]/g,"").replace(/\./g,"").replace(",","."));
  if(!isFinite(preco)||preco<0){$("pm").textContent="Preço inválido. Use números, por exemplo 3299 ou 3299,90.";return}
  var btn=$("save");btn.disabled=true;btn.textContent="Salvando…";
  try{
    var urls=[];
    for(var it of items){urls.push(it.file?await upload(it.file):it.url)}
    var obj={nome:$("n").value.trim(),tipo:$("t").value,cat:$("c").value.trim(),marca:$("m").value.trim(),preco:preco,spec:$("s").value.trim(),descricao:$("d").value.trim(),fotos:urls,oportunidade:$("op").checked,destaque:$("de").checked,ativo:$("at").checked};
    var r=editing?await sb.from("produtos").update(obj).eq("id",editing):await sb.from("produtos").insert(obj);
    if(r.error)throw r.error;
    if(removed.length)sb.storage.from("produtos").remove(removed.map(pathOf));
    $("modal").hidden=true;load();
  }catch(err){$("pm").textContent="Não foi possível salvar: "+(err.message||err)}
  btn.disabled=false;btn.textContent="Salvar";
};
</script>
</body>
</html>
